[project]
name = "plato-dmn-ecm"
version = "0.1.0"
description = "DMN-ECN reverse-actualization engine — creativity via functional distance"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cocapn Fleet", email = "fleet@cocapn.ai"},
]
keywords = ["ai", "creativity", "plato", "dmn", "ecn", "reverse-actualization", "multi-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/plato-dmn-ecm"
Documentation = "https://github.com/SuperInstance/plato-dmn-ecm#readme"
Repository = "https://github.com/SuperInstance/plato-dmn-ecm"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmn_ecm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false